<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEIS Parent Communication Portal</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/bgFrgXkW/meis.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @keyframes softBgChange {
        0% { background-color: #E2E8F0; } /* Light Slate */
        25% { background-color: #DEE2F2; } /* Muted Blue-Indigo */
        50% { background-color: #D9EAE5; } /* Muted Sage/Teal */
        75% { background-color: #E8E2D9; } /* Muted Sand/Warm Grey */
        100% { background-color: #E2E8F0; }
      }

      body {
        font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
        background-color: #E2E8F0;
        animation: softBgChange 20s ease-in-out infinite;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
    </style>

  }
}
